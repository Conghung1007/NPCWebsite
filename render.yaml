# Render Blueprint — NPC Website (1 service; portal domains later)

# Docs: https://render.com/docs/blueprint-spec

#

# When DNS is ready, uncomment `domains` below and set env then redeploy:

#   PUBLIC_APP_URL=https://npgroup.com

#   COOKIE_DOMAIN=.npgroup.com

#   VITE_GROUP_ORIGIN=https://npgroup.com

#   VITE_HUONGNGHIEP_ORIGIN=https://huongnghiep.npgroup.com

#   VITE_DICHVU_ORIGIN=https://dichvu.npgroup.com

#   VITE_LUYENTHI_ORIGIN=https://luyenthi.npgroup.com

# Đào tạo tiếng Nhật: external https://tnjs.vn (not this service)

# Until DNS: https://<service>.onrender.com/?portal=group|huongnghiep|dichvu|luyenthi

services:

  - type: web

    name: npc-website

    runtime: node

    plan: free

    region: singapore

    branch: main

    autoDeployTrigger: commit

    # Free tier often OOMs on Vite; raise heap for install + build
    buildCommand: export NODE_OPTIONS=--max-old-space-size=4096 && npm install --include=dev && npm run build

    startCommand: npm start

    healthCheckPath: /api/health

    # domains:

    #   - npgroup.com

    #   - huongnghiep.npgroup.com

    #   - dichvu.npgroup.com

    #   - luyenthi.npgroup.com

    envVars:

      - key: NODE_ENV

        value: production

      - key: NODE_VERSION

        value: "20"

      - key: NODE_OPTIONS

        value: --max-old-space-size=4096

      - key: SESSION_SECRET

        generateValue: true

      - key: DATABASE_URL

        sync: false

      - key: PUBLIC_APP_URL

        sync: false

      - key: COOKIE_DOMAIN

        sync: false

      - key: ALLOWED_ORIGINS

        sync: false

      - key: PAYOS_CLIENT_ID

        sync: false

      - key: PAYOS_API_KEY

        sync: false

      - key: PAYOS_CHECKSUM_KEY

        sync: false

      - key: RESEND_API_KEY

        sync: false

      - key: RESEND_FROM_EMAIL

        sync: false

      - key: R2_PRIMARY_ACCOUNT_ID

        sync: false

      - key: R2_PRIMARY_ACCESS_KEY_ID

        sync: false

      - key: R2_PRIMARY_SECRET_ACCESS_KEY

        sync: false

      - key: R2_PRIMARY_BUCKET_NAME

        sync: false

      - key: R2_PRIMARY_ENDPOINT

        sync: false

      - key: VITE_GROUP_ORIGIN

        sync: false

      - key: VITE_TNJS_ORIGIN

        sync: false

      - key: VITE_DUHOC_ORIGIN

        sync: false

      - key: VITE_DAOTAO_ORIGIN

        sync: false


